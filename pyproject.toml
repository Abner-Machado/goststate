[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghoststate"
version = "0.1.0"
description = "Find the condition that made your software break."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "GhostState contributors" }]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ghoststate = "ghoststate.cli:main"

[tool.setuptools.packages.find]
include = ["ghoststate*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# mypy itself only supports checking down to 3.10 semantics even though
# the package's own requires-python floor is 3.9 (runtime-tested on
# 3.11 in CI); this is a type-checker tooling limit, not a support cut.
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
